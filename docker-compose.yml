services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: driving_prep_postgres
    environment:
      POSTGRES_DB: driving_prep
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - driving_prep_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d driving_prep"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: driving_prep_redis
    ports:
      - "6379:6379"
    volumes:
      - driving_prep_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  driving_prep_postgres:
  driving_prep_redis:
